name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
        with:
          # setuptools-scm reads the version from the git tags
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # tests/test_recalc.py recalculates the generated workbook with LibreOffice
      # and fails, instead of skipping, when soffice is missing in CI.
      - name: Install LibreOffice Calc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc

      - name: Run tests with coverage
        run: pytest --cov=siemens_converter --cov-report=xml --cov-report=term-missing

      - name: Upload coverage reports to Codecov
        if: matrix.python-version == '3.15'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # The page that Pyodide runs in the browser, built and tested on every pull request.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: pip install -e ".[web]"

      - name: Build the site
        run: python web/build.py --out build/site

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Test the page in a headless browser
        run: pytest web/tests
