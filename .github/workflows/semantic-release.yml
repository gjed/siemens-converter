name: Semantic release

on:
  push:
    branches:
      - main

# GITHUB_TOKEN only checks out. The version tag and the GitHub release are
# written with the gjed-release app token below.
permissions:
  contents: read

# One release at a time: overlapping runs would compute the same next version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  semantic-release:
    name: Semantic release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Holds the gjed-release app credentials and only accepts runs from
    # protected branches, so a workflow on any other branch cannot mint the token.
    environment: release
    steps:
      # semantic-release pushes the version tag and creates the GitHub release
      # with this token. A tag pushed with GITHUB_TOKEN does not trigger other
      # workflows, so release.yml, which runs on the tag, would never build the
      # binaries. The release does not commit to main.
      - name: Mint release app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write # push the version tag, create the GitHub release
          permission-issues: write # comment on issues fixed by the release
          permission-pull-requests: write # comment on pull requests included in the release

      - uses: actions/checkout@v7
        with:
          # semantic-release requires full git history to determine the next version
          fetch-depth: 0
          # Otherwise git pushes with the persisted GITHUB_TOKEN header instead of
          # the app token semantic-release puts in the remote URL.
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install semantic-release dependencies
        run: pnpm install --frozen-lockfile

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: pnpm exec semantic-release
