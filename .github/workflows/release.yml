name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # setuptools-scm reads the version from the git tags
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # tests/test_recalc.py recalculates the generated workbook with LibreOffice
      # and fails, instead of skipping, when soffice is missing in CI.
      - name: Install LibreOffice Calc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc

      - name: Run tests
        run: pytest --tb=short

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: siemens-converter-windows.exe
            pyinstaller_name: siemens-converter.exe
          - os: ubuntu-latest
            artifact: siemens-converter-linux
            pyinstaller_name: siemens-converter

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          # setuptools-scm reads the version from the git tags
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Build binary
        shell: bash
        run: |
          SEP=":"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            SEP=";"
          fi
          OPTS="--onefile --paths src --name siemens-converter"
          OPTS="$OPTS --add-data src/siemens_converter/template.xlsx${SEP}siemens_converter"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            OPTS="$OPTS --noconsole"
          fi
          pyinstaller $OPTS scripts/pyinstaller_entry.py

      - name: Rename artifact
        shell: bash
        run: mv "dist/${{ matrix.pyinstaller_name }}" "dist/${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Rename artifacts with tag
        run: |
          mv artifacts/siemens-converter-windows.exe/siemens-converter-windows.exe \
             "artifacts/siemens-converter-windows-${TAG}.exe"
          mv artifacts/siemens-converter-linux/siemens-converter-linux \
             "artifacts/siemens-converter-linux-${TAG}"

      # semantic-release pushes the tag first and creates the GitHub release with
      # its notes afterwards, so this workflow can reach the upload before the
      # release exists. Wait for it instead of creating a second release.
      - name: Wait for the release created by semantic-release
        run: |
          for attempt in $(seq 1 40); do
            if gh release view "$TAG" > /dev/null 2>&1; then
              echo "Release $TAG found."
              exit 0
            fi
            echo "Release $TAG does not exist yet (attempt $attempt of 40), waiting..."
            sleep 15
          done
          echo "::error::Release $TAG was not created within 10 minutes."
          exit 1

      # The release notes are written by semantic-release; uploading assets
      # leaves them untouched. --clobber lets a re-run replace the assets.
      - name: Attach binaries to the release
        run: |
          gh release upload "$TAG" --clobber \
            "artifacts/siemens-converter-windows-${TAG}.exe" \
            "artifacts/siemens-converter-linux-${TAG}" \
            src/siemens_converter/static_data_template.xlsx

      - name: Clean up old release assets
        run: |
          # Keep assets only on the 3 newest stable releases.

          delete_assets_for_release() {
            local tag="$1"
            local assets
            assets=$(gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null) || return 0
            if [[ -n "$assets" ]]; then
              for asset in $assets; do
                echo "  Deleting asset: $asset from $tag"
                gh release delete-asset "$tag" "$asset" --yes
              done
            fi
          }

          echo "Keeping only 3 newest stable releases with assets..."
          gh release list --limit 100 --json tagName,isPrerelease \
            | jq -r '.[] | select(.isPrerelease == false) | .tagName' \
            | tail -n +4 | while read -r tag; do
              delete_assets_for_release "$tag"
            done

          echo "Cleanup complete."
