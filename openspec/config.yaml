context: |
  ## Purpose

  Convert a Siemens FC_report into a "Riparto" XLSX workbook that apportions heating and water costs among the apartments of a condominium. The FC_report is an HTML table saved with an `.xls` extension. A static data `.xlsx`, filled in by the building administrator for each exercise, adds what the report does not contain: the exercise year and start date, tenant and owner names, millesimali, yearly costs, main meter readings, the start readings of the central heat meters and previous readings. The output is a copy of the embedded `template.xlsx`, which holds no exercise data, with the readings and the static data injected, plus two generated sheets, `Inquilini` and `Dati Report`. Sibling of [sinapsi-converter](https://github.com/gjed/sinapsi-converter): same distribution model, different device manufacturer, input format and output.

  ## Tech Stack

  - Python 3.15 only (`requires-python = ">=3.15"`)
  - setuptools (pyproject.toml, src-layout, `template.xlsx` and `static_data_template.xlsx` as package data)
  - openpyxl (reads the static data file, fills the XLSX template)
  - `html.parser` from the standard library (reads the FC_report)
  - pytest + pytest-cov (testing)
  - PyInstaller (Windows `.exe` and Linux binary)
  - GitHub Actions (a single CI job on Python 3.15, tag-triggered releases)

  ## Project Conventions

  ### Code Style

  - Modules are single-responsibility: `models` (dataclasses, no I/O), `parser` (FC_report HTML reading), `static_reader` (static data XLSX reading), `writer` (template copy and XLSX output), `__main__` (CLI, drag-and-drop and Windows dialogs)
  - `from __future__ import annotations` in every source module
  - Type hints on public functions

  ### Architecture Patterns

  - Pipeline: `parse_fc_report` + `parse_static_data` -> `write_xlsx`, which first checks the static data against the report
  - Pure dataclasses in models.py — no I/O
  - Every cost formula lives in `template.xlsx`; the writer injects values into fixed cells and never computes costs
  - The writer adds two generated sheets to the template copy: `Inquilini` (apartment and tenant list) and `Dati Report` (the FC_report device table)
  - Entry point (`__main__.py`) wires the pipeline — no business logic there
  - Output file: `Riparto_<serial>_<dd-mm-yyyy>.xlsx`, written next to the FC_report

  ### Testing Strategy

  - pytest with fixtures in `tests/fixtures/`: `FC_report_TEST_9999_2026-01-15.xls` and `static_data_TEST.xlsx`
  - Unit tests for models, parser and static_reader
  - Integration tests for writer and CLI (write XLSX to a temporary directory, read back with openpyxl)
  - Structure tests for `template.xlsx` and `static_data_template.xlsx`
  - Coverage uploaded to Codecov from the CI job

  ### Git Workflow

  - Conventional Commits: `feat(scope): description`, `fix(scope):`, `chore(scope):`
  - `main` is protected by a ruleset: linear history, signed commits, no force pushes
  - CI runs on every pull request and on every push to `main`
  - Tag-triggered releases (`v*`) build the Windows `.exe` and the Linux binary and publish them with `static_data_template.xlsx` as a separate asset

  ## Domain Context

  Siemens manufactures thermal energy meters and heat cost allocators (HCA) used in Italian condominiums. The Siemens software exports the readings of every device as an FC_report: two metadata rows, a blank row, a header row and one row per device (central heat meters, hot water meters, heat allocators). Building administrators need those readings in the Riparto workbook that splits the yearly heating, hot water (ACS) and cold water (AFS) costs among the apartments by consumption and by millesimi.

  ## Important Constraints

  - End users are non-technical Italian speakers who run a Windows `.exe` by drag and drop. Every message they can see must be in plain Italian and say what to do.
  - Windows drag-and-drop `.exe` is the primary distribution method; the `.exe` is built with `--noconsole`, so users see message boxes and file dialogs, never a terminal
  - Files dropped on the `.exe` arrive in no fixed order and are routed by extension: the `.xlsx` is the static data, the other file is the FC_report; both are required
  - The FC_report is UTF-8 HTML with Italian decimal commas, not a real Excel file
  - `template.xlsx` is laid out for 10 apartments; the writer maps apartments 1-10 to fixed rows
  - PyInstaller bundles only `template.xlsx`; `static_data_template.xlsx` is downloaded by users from the release page
  - Real report data is confidential and gitignored — never commit it; tests use only the fixtures in `tests/fixtures/`

  ## External Dependencies

  - Runtime: openpyxl (XLSX read/write)
  - Dev: pytest, pytest-cov, pyinstaller
  - CI: GitHub Actions, Codecov
